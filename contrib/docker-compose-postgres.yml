---
services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    restart: always
    environment:
      POSTGRES_USER: data_platform_app
      POSTGRES_PASSWORD: data_platform_app
      POSTGRES_DB: data_platform_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_platform_app"]
      interval: 5s
      timeout: 5s
      retries: 5
