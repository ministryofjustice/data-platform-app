---
name: Container Scan

on:
  pull_request:
    branches:
      - main
      - development

permissions: {}

jobs:
  container-scan:
    name: Container Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-scan.yml@f48cf9157c3eae2dcecf5173a474577aabcd37a5 # v4.1.2
    with:
      containerfile-path: Dockerfile
