---
name: Container Scan

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  container-scan:
    name: Container Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-scan.yml@5a78fec83924b266564bef1a9803536a9bd68a1f # v4.0.7
    with:
      containerfile-path: Dockerfile
