---
name: Container Scan

on:
  pull_request:
    branches:
      - main
      - development

permissions: {}

jobs:
  container-scan:
    name: Container Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-scan.yml@c8dbd40674f1a0401e516e51cd6fa61c7f4fdc23 # v4.1.0
    with:
      containerfile-path: Dockerfile
