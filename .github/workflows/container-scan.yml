---
name: Container Scan

on:
  pull_request:
    branches:
      - main
      - development

permissions: {}

jobs:
  container-scan:
    name: Container Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-scan.yml@5d8d0f00346daa26a7dd1283ecd098bbcd2b5396 # v4.1.1
    with:
      containerfile-path: Dockerfile
