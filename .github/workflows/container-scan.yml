---
name: Container Scan

on:
  pull_request:
    branches:
      - main
      - development

permissions: {}

jobs:
  container-scan:
    name: Container Scan
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-scan.yml@634721c67e9e1e3502c9a737fc102093ac0cf482 # v4.2.0
    with:
      containerfile-path: Dockerfile
