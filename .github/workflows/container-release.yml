---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@f81658c938374c2f5a69b0ad8e2c89948e29aad0 # v4.0.10
    with:
      containerfile-path: Dockerfile
