---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@7254f4a35b6251bf442bf84335b6bd27f9d88689 # v4.1.4
    with:
      containerfile-path: Dockerfile
