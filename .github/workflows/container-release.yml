---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@6df010e45fdb953369f12ab2bc69107d3c487f15 # v4.0.8
    with:
      containerfile-path: Dockerfile
