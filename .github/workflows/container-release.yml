---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@f48cf9157c3eae2dcecf5173a474577aabcd37a5 # v4.1.2
    with:
      containerfile-path: Dockerfile
