---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@ff9b59430b75056f2234fc204651ca64c9c4f474 # v4.0.9
    with:
      containerfile-path: Dockerfile
