---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@634721c67e9e1e3502c9a737fc102093ac0cf482 # v4.2.0
    with:
      containerfile-path: Dockerfile
