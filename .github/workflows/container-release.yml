---
name: Container Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@5d8d0f00346daa26a7dd1283ecd098bbcd2b5396 # v4.1.1
    with:
      containerfile-path: Dockerfile
