---
name: Build and Test

on:
  pull_request:
    branches:
      - main
      - development

permissions: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: data_platform_app

      - name: Pull Test Dependencies
        id: pull_test_dependencies
        run: |
          for i in 1 2 3; do
            docker compose --file docker-compose-test.yml pull db && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1
        env:
          IMAGE_TAG: data_platform_app

      - name: Run Python Tests
        id: run_python_tests
        run: |
          docker compose --file docker-compose-test.yml run --rm interfaces
        env:
          NETWORK: default
          IMAGE_TAG: data_platform_app
