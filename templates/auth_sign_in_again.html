{% extends "base/base.html" %}
{% block title %}
  Sign in again | Justice Data Platform
{% endblock title %}
{% block content %}
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <h1 class="govuk-heading-l">Sign in again</h1>
      <p class="govuk-body">We could not complete your sign-in. Please try again.</p>
      <a href="{% url 'login' %}"
         role="button"
         draggable="false"
         class="govuk-button"
         data-module="govuk-button">Sign in</a>
    </div>
  </div>
{% endblock content %}
