{% if service_navigation_items %}
  <div class="govuk-service-navigation {% if show_masthead %}govuk-service-navigation--inverse{% endif %}"
       data-module="govuk-service-navigation">
    <div class="govuk-width-container">
      <div class="govuk-service-navigation__container">
        <nav aria-label="Menu" class="govuk-service-navigation__wrapper">
          <button type="button"
                  class="govuk-service-navigation__toggle govuk-js-service-navigation-toggle"
                  aria-controls="navigation"
                  hidden
                  aria-hidden="true">Menu</button>
          <ul class="govuk-service-navigation__list" id="navigation">
            {% for item in service_navigation_items %}
              <li class="govuk-service-navigation__item{% if item.active %} govuk-service-navigation__item--active{% endif %}">
                <a class="govuk-service-navigation__link"
                   href="{{ item.url }}"
                   {% if item.active %}aria-current="true"{% endif %}>{{ item.name }}</a>
              </li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </div>
  </div>
{% endif %}
