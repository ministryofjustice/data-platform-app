{% comment %}
  Expects:
    threshold - highest monthly budget warning threshold reached (number)
{% endcomment %}
<article class="moj-ticket-panel app-usage-budget-banner"
         aria-label="Monthly budget warning">
  <section class="moj-ticket-panel__content" aria-label="Budget usage">
    <p class="govuk-body govuk-!-font-weight-bold govuk-!-margin-bottom-1">
      You've spent more than {{ threshold }}% of your monthly budget
    </p>
    <p class="govuk-body govuk-!-margin-bottom-0">
      Learn how to <a class="govuk-link"
    href="https://user-guide.data-platform.service.justice.gov.uk/support/index.html#request-an-increase-to-your-ai-usage-limits">request an increase to your AI usage limits</a>
    </p>
  </section>
</article>
