<table class="govuk-table moj-multi-select"
       data-module="moj-multi-select"
       aria-describedby="{% if field.help_text %}{{ field.html_name }}-hint{% endif %}{% if field.errors %} {{ field.html_name }}-error{% endif %}"
       data-id-prefix="models-">
  <thead class="govuk-table__head">
    <tr class="govuk-table__row">
      <th class="govuk-table__header" scope="col">
        <div id="models-select-all"></div>
        <span class="govuk-visually-hidden">Select model</span>
      </th>
      <th class="govuk-table__header" scope="col">Name</th>
      <th class="govuk-table__header" scope="col">Provider</th>
    </tr>
  </thead>
  <tbody class="govuk-table__body">
    {% for model in available_models %}
      <tr class="govuk-table__row">
        <td class="govuk-table__cell">
          <div class="govuk-checkboxes govuk-checkboxes--small">
            <div class="govuk-checkboxes__item">
              <input class="govuk-checkboxes__input"
                     id="models-{{ model.model_name|slugify }}"
                     name="{{ field.html_name }}"
                     type="checkbox"
                     value="{{ model.model_name }}"
                     {% if field.value and model.model_name in field.value %}checked{% endif %}>
              <label class="govuk-label govuk-checkboxes__label"
                     for="models-{{ model.model_name|slugify }}">
                <span class="govuk-visually-hidden">Select {{ model.litellm_params.ai_model_name|default:model.model_name }}</span>
              </label>
            </div>
          </div>
        </td>
        <td class="govuk-table__cell">{{ model.litellm_params.ai_model_name|default:model.model_name }}</td>
        <td class="govuk-table__cell">{{ model.litellm_params.ai_model_provider|default:"-" }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
