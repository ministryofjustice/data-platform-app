{% comment %}
  Expects:
    month_choices  - list of date objects, most recent first
    selected_month - the currently selected date object
{% endcomment %}
<form method="get"
      class="app-usage-month-select"
      data-module="app-auto-submit-select">
  <div class="govuk-form-group govuk-!-margin-bottom-0 govuk-!-display-inline-block">
    <label class="govuk-label govuk-!-font-weight-bold govuk-!-display-inline-block"
           for="{{ month_form.month.id_for_label }}">{{ month_form.month.label }}</label>
    <select class="govuk-select"
            id="{{ month_form.month.id_for_label }}"
            name="{{ month_form.month.html_name }}">
      {% for value, label in month_form.month.field.choices %}
        <option value="{{ value }}"
                {% if value == selected_month|date:"Y-m" %}selected{% endif %}>
          {{ label }}
        </option>
      {% endfor %}
    </select>
  </div>
  <noscript>
    <button type="submit"
            class="govuk-button govuk-button--secondary govuk-!-margin-bottom-0 govuk-!-margin-left-2">
      View
    </button>
  </noscript>
</form>
