<p class="govuk-body">
  Showing {{ visible_count }} of {{ match_count }} model{{ match_count|pluralize }}.
  {% if has_more %}
    <a class="govuk-link"
       href="{% url 'ai_gateway:key_create' project.uuid %}?expanded=1"
       hx-get="{% url 'ai_gateway:key_create' project.uuid %}"
       hx-vals='{"expanded": "1"}'
       hx-target="#model-list"
       hx-include="closest form"
       hx-swap="innerHTML">Show all</a>
  {% endif %}
</p>
